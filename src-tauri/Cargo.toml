[workspace]
members = ["core"]
default-members = [".", "core"]
exclude = ["patches/tauri-plugin-media", "patches/velopack"]
resolver = "2"

[package]
name = "sparkle"
version = "0.5.0"
description = "A local-first music player for your own library."
authors = ["doabell"]
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/doabell/sparkle"
homepage = "https://github.com/doabell/sparkle"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sparkle_lib"
# The Windows executable links this Rust library; mobile library outputs are unused.
crate-type = ["rlib"]

# Native unit tests live in the two workspace libraries; the executable starts the app.
[[bin]]
name = "sparkle"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

[dependencies]
sparkle-core = { path = "core" }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
lofty = { version = "0.25.1", features = ["serde"] }
# Keep playback, supported decoders, and output dithering; recording is unused.
rodio = { version = "0.22.2", default-features = false, features = ["64bit", "playback", "flac", "mp3", "mp4", "vorbis", "wav", "dither"] }
sha2 = "0.10.9"
ebur128 = "0.1.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Share ring with the updater and S3 signing; retain reqwest's other default features.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json", "blocking", "query", "form", "multipart"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
base64 = "0.23.1"
discord-rich-presence = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
md-5 = "0.11.0"
tauri-plugin-media = "0.1.1"
log = "0.4.33"
tauri-plugin-log = "2.9.0"

[patch.crates-io]
# The upstream Windows adapter enables MediaPlayer's automatic command manager
# while also installing a manual ButtonPressed handler. Sparkle needs the
# manual handler to route controls to its own audio engine.
tauri-plugin-media = { path = "patches/tauri-plugin-media" }
# Keep the updater on the same Windows bindings as Tauri and CPAL.
velopack = { path = "patches/velopack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_GdiPlus", "Win32_UI_WindowsAndMessaging"] }
velopack = "=1.2.0"

# Sound Check is intentionally a background task, but unoptimized true-peak
# DSP runs slower than real time in `tauri dev`. Keep the analyzer fast enough
# for realistic local testing without optimizing Sparkle's own debug build.
[profile.dev.package.ebur128]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
