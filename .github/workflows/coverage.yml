name: Coverage

on:
    push:
        branches: [main]

permissions:
    contents: read
    actions: read

concurrency:
    group: coverage-${{ github.ref }}
    cancel-in-progress: true

jobs:
    coverage:
        runs-on: windows-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Select coverage from changed paths
              id: changes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CI_WORKFLOW_FILE: coverage.yml
              run: bun scripts/ci-changes.mjs

            - name: Install Bun dependencies
              if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.rust == 'true'
              run: bun install --frozen-lockfile

            - name: Check release version
              run: bun run version:check

            - name: Check TypeScript coverage
              if: steps.changes.outputs.frontend == 'true'
              run: bun run test:coverage:ts

            - name: Set up Rust and cache builds
              if: steps.changes.outputs.rust == 'true'
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  cache-workspaces: ./src-tauri -> target
                  cache-on-failure: false
                  rustflags: ""
                  components: llvm-tools-preview

            - name: Cache cargo-llvm-cov
              if: steps.changes.outputs.rust == 'true'
              id: cargo-llvm-cov-cache
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.cargo/bin/cargo-llvm-cov.exe
                  key: cargo-llvm-cov-0.9.0-${{ runner.os }}-${{ runner.arch }}

            - name: Install Rust coverage tool
              if: steps.changes.outputs.rust == 'true' && steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  $archive = Join-Path $env:RUNNER_TEMP 'cargo-llvm-cov-0.9.0.zip'
                  Invoke-WebRequest 'https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.0/cargo-llvm-cov-x86_64-pc-windows-msvc.zip' -OutFile $archive
                  $expected = '5f2c1d805136aadd53483af6cdf3e123291e9a224c37dc5817aab9563b0eef64'
                  if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
                      throw 'cargo-llvm-cov archive checksum mismatch.'
                  }
                  $extracted = Join-Path $env:RUNNER_TEMP 'cargo-llvm-cov-0.9.0'
                  Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
                  Copy-Item -LiteralPath (Join-Path $extracted 'cargo-llvm-cov.exe') -Destination (Join-Path $env:USERPROFILE '.cargo/bin/cargo-llvm-cov.exe') -Force
                  cargo llvm-cov --version
                  if ($LASTEXITCODE -ne 0) { throw 'cargo-llvm-cov failed to start.' }

            - name: Check Rust coverage
              if: steps.changes.outputs.rust == 'true'
              run: bun run test:coverage:rs

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 14
