name: Coverage

on:
    push:
        branches: [main]

permissions:
    contents: read
    actions: read

concurrency:
    group: coverage-${{ github.ref }}
    cancel-in-progress: true

jobs:
    coverage:
        runs-on: windows-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4

            - name: Select coverage from changed paths
              id: changes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CI_WORKFLOW_FILE: coverage.yml
              run: bun scripts/ci-changes.mjs

            - name: Install Bun dependencies
              if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.rust == 'true'
              run: bun install --frozen-lockfile

            - name: Check release version
              run: bun run version:check

            - name: Check TypeScript coverage
              if: steps.changes.outputs.frontend == 'true'
              run: bun run test:coverage:ts

            - name: Set up Rust and cache builds
              if: steps.changes.outputs.rust == 'true'
              uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  cache-workspaces: ./src-tauri -> target
                  cache-on-failure: false
                  build-warnings: "warn"
                  components: llvm-tools-preview

            - name: Cache cargo-llvm-cov
              if: steps.changes.outputs.rust == 'true'
              id: cargo-llvm-cov-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/bin/cargo-llvm-cov.exe
                  key: cargo-llvm-cov-0.9.1-${{ runner.os }}-${{ runner.arch }}

            - name: Install Rust coverage tool
              if: steps.changes.outputs.rust == 'true' && steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  $archive = Join-Path $env:RUNNER_TEMP 'cargo-llvm-cov-0.9.1.zip'
                  Invoke-WebRequest 'https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-pc-windows-msvc.zip' -OutFile $archive
                  $expected = '656590cfa13bb7478595bbfdd3bc6bc075a4f7f3f0df5a439c1856cb03c5a4d2'
                  if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
                      throw 'cargo-llvm-cov archive checksum mismatch.'
                  }
                  $extracted = Join-Path $env:RUNNER_TEMP 'cargo-llvm-cov-0.9.1'
                  Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
                  Copy-Item -LiteralPath (Join-Path $extracted 'cargo-llvm-cov.exe') -Destination (Join-Path $env:USERPROFILE '.cargo/bin/cargo-llvm-cov.exe') -Force
                  cargo llvm-cov --version
                  if ($LASTEXITCODE -ne 0) { throw 'cargo-llvm-cov failed to start.' }

            - name: Check Rust coverage
              if: steps.changes.outputs.rust == 'true'
              run: bun run test:coverage:rs

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 14
