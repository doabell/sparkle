name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read
    actions: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: windows-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Select checks from changed paths
              id: changes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CI_WORKFLOW_FILE: ci.yml
              run: bun scripts/ci-changes.mjs

            - name: Set up Rust and cache test and release builds
              if: steps.changes.outputs.rust == 'true' || (github.event_name == 'push' && steps.changes.outputs.package == 'true')
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  # Includes debug/test and x86_64-pc-windows-msvc/release artifacts.
                  cache-workspaces: ./src-tauri -> target
                  # Preserve existing verify caches; main warms the baseline for PRs and tags.
                  cache-shared-key: verify
                  # Main saves test and release dependencies; PRs save test dependencies.
                  cache-on-failure: false
                  rustflags: ""

            - name: Install Bun dependencies
              run: bun install --frozen-lockfile

            - name: Check release version
              run: bun run version:check

            - name: Check formatting
              run: bunx --no-install prettier --check .

            - name: Check Rust formatting
              if: steps.changes.outputs.rust == 'true'
              run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

            - name: Check Svelte and TypeScript
              if: steps.changes.outputs.frontend == 'true'
              run: bun run check

            - name: Run frontend tests
              if: steps.changes.outputs.frontend == 'true'
              run: bun run test

            - name: Build frontend
              if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.rust == 'true' || steps.changes.outputs.package == 'true'
              run: bun run build

            - name: Check dependency licenses
              if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.rust == 'true' || steps.changes.outputs.package == 'true'
              run: bun run licenses:check --built

            - name: Run Rust tests
              if: steps.changes.outputs.rust == 'true'
              run: cargo test --lib --locked --manifest-path src-tauri/Cargo.toml

            - name: Set up .NET for Velopack
              if: github.event_name == 'push' && steps.changes.outputs.package == 'true'
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 8.0.x

            - name: Restore pinned Velopack CLI
              if: github.event_name == 'push' && steps.changes.outputs.package == 'true'
              run: dotnet tool restore

            - name: Build and verify Windows setup and update feed
              if: github.event_name == 'push' && steps.changes.outputs.package == 'true'
              run: bun run package:windows

            - name: Upload Windows packages for testing
              if: github.event_name == 'push' && steps.changes.outputs.package == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: sparkle-windows-x64
                  path: .tmp/releases/*
                  if-no-files-found: error
                  retention-days: 30
