name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: windows-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Set up Rust and cache builds
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  cache-workspaces: ./src-tauri -> target
                  rustflags: ""
                  components: llvm-tools-preview

            - name: Install Rust coverage tool
              run: cargo install cargo-llvm-cov --version 0.9.0 --locked

            - name: Install Bun dependencies
              run: bun install --frozen-lockfile

            - name: Check release version
              run: bun run version:check

            - name: Check formatting
              run: bun run format:check

            - name: Check Svelte and TypeScript
              run: bun run check

            - name: Check TypeScript coverage
              run: bun run test:coverage:ts

            - name: Build frontend
              run: bun run build

            - name: Run Rust tests
              run: cargo test --locked --manifest-path src-tauri/Cargo.toml

            - name: Check Rust coverage
              run: bun run test:coverage:rs

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 14
