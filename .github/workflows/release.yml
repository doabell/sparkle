name: Release

on:
    push:
        tags: [v*]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    windows-setup:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Verify release tag is on main
              shell: pwsh
              run: |
                  git merge-base --is-ancestor $env:GITHUB_SHA origin/main
                  if ($LASTEXITCODE -ne 0) {
                      throw "Release tag $env:GITHUB_REF_NAME does not point to a commit on main."
                  }

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Set up Rust and cache builds
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  cache-workspaces: ./src-tauri -> target
                  rustflags: ""

            - name: Install Bun dependencies
              run: bun install --frozen-lockfile

            - name: Check release version
              run: bun run version:check

            - name: Set up .NET for Velopack
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 8.0.x

            - name: Restore pinned Velopack CLI
              run: dotnet tool restore

            - name: Build and verify Windows setup and update feed
              run: bun run package:windows

            - name: Create draft GitHub release with setup and update packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: >-
                  dotnet tool run vpk -- upload github
                  --outputDir .tmp/releases
                  --channel win-x64
                  --repoUrl "https://github.com/$env:GITHUB_REPOSITORY"
                  --token "$env:GITHUB_TOKEN"
                  --tag "$env:GITHUB_REF_NAME"
                  --targetCommitish "$env:GITHUB_SHA"
                  --releaseName "Sparkle $env:GITHUB_REF_NAME"
