name: Release

on:
    push:
        tags: [v*]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    windows-msi:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Verify release tag is on main
              shell: pwsh
              run: |
                  git merge-base --is-ancestor $env:GITHUB_SHA origin/main
                  if ($LASTEXITCODE -ne 0) {
                      throw "Release tag $env:GITHUB_REF_NAME does not point to a commit on main."
                  }

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Set up Rust and cache builds
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  cache-workspaces: ./src-tauri -> target
                  rustflags: ""

            - name: Install Bun dependencies
              run: bun install --frozen-lockfile

            - name: Check release version
              run: bun run version:check

            - name: Build MSI and create draft release
              uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: Sparkle v__VERSION__
                  releaseBody: See CHANGELOG.md for release notes.
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: false
                  uploadUpdaterSignatures: false
                  releaseAssetNamePattern: Sparkle_[version]_[platform]_[arch][ext]
                  args: --bundles msi
