name: Release

on:
    push:
        tags: [v*]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    windows-msi:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: npm

            - name: Set up Rust and cache builds
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  cache-workspaces: ./src-tauri -> target
                  rustflags: ""

            - name: Install frontend dependencies
              run: npm ci

            - name: Check release version
              run: npm run version:check

            - name: Check formatting
              run: npm run format:check

            - name: Check Svelte and TypeScript
              run: npm run check

            - name: Run frontend tests
              run: npm test

            - name: Run Rust tests
              run: cargo test --locked --manifest-path src-tauri/Cargo.toml

            - name: Build MSI and create draft release
              uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: Sparkle v__VERSION__
                  releaseBody: See CHANGELOG.md for release notes.
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: false
                  uploadUpdaterSignatures: false
                  releaseAssetNamePattern: Sparkle_[version]_[platform]_[arch][ext]
                  args: --bundles msi
