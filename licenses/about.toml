# Include runtime dependencies for the Windows release. Prefer the Apache/BSD
# options when offered; retain complete upstream notices alongside the terms.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
